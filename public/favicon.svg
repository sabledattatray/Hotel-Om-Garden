<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="omGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA84D" />
      <stop offset="100%" stop-color="#FF881A" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281A12" />
      <stop offset="100%" stop-color="#140D09" />
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#omGrad)" stroke-width="1.8" stroke-dasharray="86 6" />
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#FF9933" stroke-width="0.75" opacity="0.4" />

  <!-- Botanical Garden Leaf Arch at bottom -->
  <path d="M18 42 C24 47, 30 46, 32 44 C34 46, 40 47, 46 42 C41 45, 34 45, 32 42 C30 45, 23 45, 18 42 Z" fill="#FF9933" opacity="0.9" />

  <!-- Center Devanagari Om (ॐ) -->
  <text 
    x="32" 
    y="39" 
    text-anchor="middle" 
    font-family="'Noto Serif Devanagari', 'Noto Sans Devanagari', 'Mangal', 'Devanagari Sangam MN', serif" 
    font-size="28" 
    font-weight="700" 
    fill="url(#omGrad)"
    letter-spacing="-0.5"
  >ॐ</text>

  <!-- Small top decorative star/sparkle -->
  <circle cx="32" cy="11.5" r="1.5" fill="#FFA84D" />
</svg>
