<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .font-mr { font-family: 'Noto Sans Devanagari', 'Liberation Sans', sans-serif; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051510" />
      <stop offset="50%" stop-color="#0E2D24" />
      <stop offset="100%" stop-color="#04120D" />
    </linearGradient>

    <!-- Saffron Central Aura for Safe Zone -->
    <radialGradient id="centerAura" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FF9933" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftGlow" cx="12%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="88%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="30%" stop-color="#FFE4B5" />
      <stop offset="70%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#B35900" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E66B00" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143B30" />
      <stop offset="100%" stop-color="#0D261F" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E2821" stop-opacity="0.95" />
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#centerAura)" />
  <rect width="1200" height="630" fill="url(#leftGlow)" />
  <rect width="1200" height="630" fill="url(#rightGlow)" />

  <!-- Subtle Sacred Geometric Overlay -->
  <g opacity="0.035" stroke="#FFFFFF" stroke-width="1" fill="none">
    <circle cx="600" cy="315" r="460" />
    <circle cx="600" cy="315" r="320" />
    <circle cx="600" cy="315" r="180" />
    <polygon points="600,50 860,490 340,490" />
    <polygon points="600,580 860,140 340,140" />
  </g>

  <!-- Outer Frame -->
  <rect x="22" y="22" width="1156" height="586" rx="16" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.85" />
  <rect x="30" y="30" width="1140" height="570" rx="12" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="8 6" opacity="0.35" />

  <!-- Corner Filigrees -->
  <g transform="translate(38, 38)">
    <path d="M0,26 L0,0 L26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="10" cy="10" r="2.5" fill="#FFE0B2" />
  </g>
  <g transform="translate(1162, 38)">
    <path d="M0,26 L0,0 L-26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="-10" cy="10" r="2.5" fill="#FFE0B2" />
  </g>
  <g transform="translate(38, 592)">
    <path d="M0,-26 L0,0 L26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="10" cy="-10" r="2.5" fill="#FFE0B2" />
  </g>
  <g transform="translate(1162, 592)">
    <path d="M0,-26 L0,0 L-26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="-10" cy="-10" r="2.5" fill="#FFE0B2" />
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT FLANK (Wider Viewport Decorative Art: Maharashtrian Thali & Delicacies) -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 160)" opacity="0.95">
    <!-- Glowing Brass Thali -->
    <circle cx="100" cy="120" r="90" fill="#143A31" stroke="url(#goldStroke)" stroke-width="3" filter="url(#shadowFilter)" />
    <circle cx="100" cy="120" r="78" fill="#0D261F" stroke="#E67300" stroke-width="1.2" stroke-dasharray="5 3" />
    
    <!-- Bhakri -->
    <circle cx="100" cy="120" r="34" fill="#F4E4BA" stroke="#D1B87F" stroke-width="1.5" />
    <circle cx="95" cy="115" r="2.5" fill="#C49B55" opacity="0.6" />
    <circle cx="106" cy="126" r="2" fill="#C49B55" opacity="0.6" />
    
    <!-- Katori 1: Tambda Rassa (Red Curry) -->
    <circle cx="68" cy="80" r="18" fill="#A83210" stroke="#FFD180" stroke-width="1.5" />
    <circle cx="68" cy="80" r="15" fill="#BA3C13" />
    
    <!-- Katori 2: Sukka Masala -->
    <circle cx="132" cy="80" r="18" fill="#5E2812" stroke="#FFD180" stroke-width="1.5" />
    <circle cx="132" cy="80" r="15" fill="#783417" />
    
    <!-- Katori 3: Pithla / Dal -->
    <circle cx="52" cy="132" r="16" fill="#D99B00" stroke="#FFD180" stroke-width="1.5" />
    <circle cx="52" cy="132" r="13" fill="#F0AC00" />
    
    <!-- Katori 4: Indrayani Rice -->
    <circle cx="148" cy="132" r="16" fill="#FAF6EC" stroke="#FFD180" stroke-width="1.5" />
    <circle cx="148" cy="132" r="13" fill="#FFFFFF" />

    <!-- Thali Mini Ribbon -->
    <rect x="25" y="222" width="150" height="26" rx="13" fill="url(#badgeGrad)" filter="url(#shadowFilter)" />
    <text x="100" y="239" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mr">
      अस्सल गावरान चव
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT FLANK (Wider Viewport Decorative Art: Shivaji Maharaj Silhouette & Bhagwa Zenda) -->
  <!-- ========================================================================= -->
  <g transform="translate(980, 150)" opacity="0.95">
    <!-- Halo Aura -->
    <circle cx="100" cy="110" r="95" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    <circle cx="100" cy="110" r="85" fill="#FF9933" fill-opacity="0.08" />

    <!-- Equestrian Silhouette -->
    <g transform="translate(20, 20) scale(0.65)" fill="#FF9933" filter="url(#glowFilter)" opacity="0.85">
      <!-- Horse & Rider -->
      <path d="M120,40 Q130,20 150,15 Q170,12 185,25 Q195,35 185,55 Q175,70 190,85 Q210,105 240,110 Q280,115 310,140 Q330,160 325,190 Q320,210 290,230 Q280,240 285,270 Q290,300 270,330 L250,340 L240,280 Q220,290 200,340 L180,340 Q190,290 170,270 Q140,270 120,250 Q90,230 85,190 Q80,160 100,130 Q110,110 115,80 Z" />
      <path d="M260,200 Q280,170 300,140 Q315,120 330,110 Q340,105 345,115 Q340,125 320,150 L295,195 Z" />
      <path d="M165,15 L260,-60 L266,-56 L172,22 Z" fill="#FFE0B2" />
      <!-- Pagadi & Feather -->
      <circle cx="150" cy="15" r="10" fill="#FFE0B2" />
    </g>

    <!-- Fluttering Bhagwa Zenda -->
    <g transform="translate(140, -10)">
      <line x1="0" y1="0" x2="0" y2="150" stroke="#FFE0B2" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4.5" fill="#FFD180" />
      <path d="M0,6 C22,2 44,14 62,8 C76,4 90,11 98,22 L58,38 L98,56 C84,66 62,59 44,65 C22,71 11,62 0,63 Z" fill="url(#badgeGrad)" stroke="#FFA726" stroke-width="0.8" />
    </g>

    <!-- Jai Shivray Ribbon -->
    <rect x="25" y="232" width="150" height="26" rx="13" fill="#170E08" stroke="#FF9933" stroke-width="1.2" filter="url(#shadowFilter)" />
    <text x="100" y="249" text-anchor="middle" fill="#FFB066" font-size="12" font-weight="700" class="font-mr">
      जय शिवराय
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTRAL SAFE ZONE (X = 260 to 940) — 100% RESPONSIVE FOR FACEBOOK & WHATSAPP -->
  <!-- ========================================================================= -->

  <!-- 1. Top Grand Saffron Header Pill -->
  <g transform="translate(600, 52)">
    <rect x="-190" y="0" width="380" height="34" rx="17" fill="url(#badgeGrad)" filter="url(#shadowFilter)" />
    <!-- Left Small Vector Flag -->
    <path d="M-170,11 L-170,25 M-170,11 L-154,14 L-160,18 L-154,22 L-170,22" stroke="#FFF" stroke-width="1.5" fill="#FFE4B5" stroke-linejoin="round" />
    <!-- Text -->
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mr" letter-spacing="0.5">
      अस्सल महाराष्ट्रीयन फॅमिली रेस्टॉरंट
    </text>
    <!-- Right Small Vector Flag -->
    <path d="M154,11 L154,25 M154,11 L170,14 L164,18 L170,22 L154,22" stroke="#FFF" stroke-width="1.5" fill="#FFE4B5" stroke-linejoin="round" />
  </g>

  <!-- 2. Royal OM Crest Emblem -->
  <g transform="translate(600, 116)">
    <circle cx="0" cy="0" r="27" fill="#143B30" stroke="url(#goldStroke)" stroke-width="2.2" filter="url(#shadowFilter)" />
    <!-- Petals -->
    <circle cx="0" cy="-19" r="2.5" fill="#FF9933" />
    <circle cx="0" cy="19" r="2.5" fill="#FF9933" />
    <circle cx="-19" cy="0" r="2.5" fill="#FF9933" />
    <circle cx="19" cy="0" r="2.5" fill="#FF9933" />
    <text x="0" y="9" text-anchor="middle" fill="url(#goldTextGrad)" font-size="28" font-weight="900" class="font-mr">ॐ</text>
  </g>

  <!-- 3. Grand Hotel Name (Centerpiece) -->
  <g transform="translate(600, 192)">
    <!-- Shadow -->
    <text x="2" y="2" text-anchor="middle" fill="#000000" opacity="0.6" font-size="52" font-weight="900" class="font-mr">
      हॉटेल ओम गार्डन
    </text>
    <!-- Gold Gradient Title -->
    <text x="0" y="0" text-anchor="middle" fill="url(#goldTextGrad)" font-size="52" font-weight="900" class="font-mr">
      हॉटेल ओम गार्डन
    </text>
  </g>

  <!-- 4. Subtitle English Branding -->
  <g transform="translate(600, 226)">
    <text x="0" y="0" text-anchor="middle" fill="#FFE0B2" opacity="0.9" font-size="14" font-weight="700" letter-spacing="3">
      HOTEL OM GARDEN • MANDALI (KARJAT)
    </text>
  </g>

  <!-- 5. Highway Location Strip (Safe & Clear) -->
  <g transform="translate(600, 248)">
    <rect x="-250" y="0" width="500" height="34" rx="17" fill="url(#pillGrad)" stroke="#FF9933" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Location Pin Vector Icon -->
    <path d="M-215,10 C-219,10 -222,13 -222,17 C-222,22 -215,27 -215,27 C-215,27 -208,22 -208,17 C-208,13 -211,10 -215,10 Z" fill="#FF9933" />
    <circle cx="-215" cy="16" r="2.5" fill="#FFFFFF" />
    <text x="10" y="22" text-anchor="middle" fill="#FFF4E0" font-size="14" font-weight="600" class="font-mr">
      अहमदनगर–सोलापूर महामार्ग, मांदळी (ता. कर्जत)
    </text>
  </g>

  <!-- 6. Four Core Features Grid (Safe Area: width 530 centered around 600) -->
  <g transform="translate(600, 300)">
    <!-- Row 1: Left Card (Food) -->
    <g transform="translate(-260, 0)">
      <rect width="250" height="52" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="28" cy="26" r="16" fill="#FF9933" fill-opacity="0.2" />
      <!-- Hot Food Bowl Vector -->
      <path d="M19,25 Q28,34 37,25 Z" fill="#FFB066" />
      <path d="M23,21 Q25,17 23,15 M28,21 Q30,17 28,15 M33,21 Q35,17 33,15" stroke="#FFE4B5" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <text x="54" y="24" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mr">अस्सल गावरान जेवण</text>
      <text x="54" y="41" fill="#CBD5E1" font-size="11" font-weight="500" class="font-mr">चिकन, मटण व गरमागरम भाकरी</text>
    </g>

    <!-- Row 1: Right Card (Family) -->
    <g transform="translate(10, 0)">
      <rect width="250" height="52" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="28" cy="26" r="16" fill="#FF9933" fill-opacity="0.2" />
      <!-- Family Silhouette Vector -->
      <circle cx="24" cy="21" r="3.5" fill="#FFB066" />
      <path d="M19,31 C19,27 29,27 29,31" stroke="#FFB066" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="33" cy="23" r="3" fill="#FFE4B5" />
      <path d="M29,31 C29,28 37,28 37,31" stroke="#FFE4B5" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="54" y="24" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mr">स्वतंत्र कुटुंब बैठक</text>
      <text x="54" y="41" fill="#CBD5E1" font-size="11" font-weight="500" class="font-mr">शांत, सुरक्षित कौटुंबिक वातावरण</text>
    </g>

    <!-- Row 2: Left Card (Parking) -->
    <g transform="translate(-260, 62)">
      <rect width="250" height="52" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="28" cy="26" r="16" fill="#FF9933" fill-opacity="0.2" />
      <!-- Parking 'P' Badge Vector -->
      <circle cx="28" cy="26" r="11" fill="#2563EB" />
      <text x="28" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="sans-serif">P</text>
      <text x="54" y="24" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mr">प्रशस्त मोफत पार्किंग</text>
      <text x="54" y="41" fill="#CBD5E1" font-size="11" font-weight="500" class="font-mr">महामार्गावर सुरक्षित सोय</text>
    </g>

    <!-- Row 2: Right Card (Permit Room) -->
    <g transform="translate(10, 62)">
      <rect width="250" height="52" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="28" cy="26" r="16" fill="#FF9933" fill-opacity="0.2" />
      <!-- Glass / Beverage Vector -->
      <path d="M22,19 L34,19 L31,27 L25,27 Z M28,27 L28,33 M24,33 L32,33" stroke="#FFB066" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="54" y="24" fill="#FFFFFF" font-size="14" font-weight="700" class="font-mr">स्वतंत्र परमिट रूम</text>
      <text x="54" y="41" fill="#CBD5E1" font-size="11" font-weight="500" class="font-mr">कायदेशीर व स्वतंत्र व्यवस्था</text>
    </g>
  </g>

  <!-- 7. Verified Rating & Service Highlights -->
  <g transform="translate(600, 442)">
    <!-- Star Vector -->
    <polygon points="-215,0 -213,5 -207,5 -211,8 -209,13 -215,10 -221,13 -219,8 -223,5 -217,5" fill="#FACC15" transform="translate(0, -7)" />
    <text x="-140" y="0" text-anchor="middle" fill="#FFE4B5" font-size="13" font-weight="600" class="font-mr">
      ४.८/५ ग्राहक रेटिंग
    </text>
    <!-- Bullet Dot -->
    <circle cx="-75" cy="-4" r="2.5" fill="#FF9933" />
    <!-- Clock Vector -->
    <circle cx="-50" cy="-4" r="6" stroke="#FFE4B5" stroke-width="1.2" fill="none" />
    <path d="M-50,-7 L-50,-4 L-47,-4" stroke="#FFE4B5" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <text x="40" y="0" text-anchor="middle" fill="#FFE4B5" font-size="13" font-weight="600" class="font-mr">
      सकाळी ९:०० ते रात्री ११:००
    </text>
    <!-- Bullet Dot -->
    <circle cx="145" cy="-4" r="2.5" fill="#FF9933" />
    <text x="195" y="0" text-anchor="middle" fill="#FFE4B5" font-size="13" font-weight="600" class="font-mr">
      दररोज सेवा
    </text>
  </g>

  <!-- 8. Main Call-To-Action Phone Badge (Centered & Prominent) -->
  <g transform="translate(600, 470)">
    <!-- Pill Container -->
    <rect x="-240" y="0" width="480" height="46" rx="23" fill="#0C251F" stroke="url(#goldStroke)" stroke-width="2" filter="url(#shadowFilter)" />
    <!-- Call Icon Bubble -->
    <circle cx="-195" cy="23" r="14" fill="#FF9933" />
    <path d="M-199,18 C-201,18 -202,19.5 -201,21 C-200,22.5 -198,24 -197,25 C-195.5,26 -194,27 -192,26 C-190.5,25.5 -190,24 -190.5,22.5 L-191.5,21 C-192,20 -193,20 -193.5,20.5 L-194.5,21.5 C-195,22 -195.8,21.5 -196.2,21 C-196.8,20.2 -197.2,19.5 -196.8,19 L-196,18 C-195.5,17.5 -195.5,16.5 -196,16 L-197.5,15 C-198,14.5 -198.8,14.5 -199,15 Z" fill="#FFFFFF" />
    <text x="-4" y="29" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" class="font-mr" letter-spacing="0.8">
      संपर्क: +91 7744009199 / 9767294601
    </text>
  </g>

  <!-- 9. Bottom Booking & Website Banner -->
  <g transform="translate(600, 545)">
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="url(#badgeGrad)" />
    <text x="0" y="19" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font-mr" letter-spacing="0.5">
      टेबल बुकिंग व ऑर्डरसाठी संपर्क करा
    </text>
  </g>

</svg>
