<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700;800;900&amp;family=Noto+Serif+Devanagari:wght@700;900&amp;display=swap');
      .font-mr { font-family: 'Noto Sans Devanagari', 'Liberation Sans', sans-serif; }
      .font-serif-mr { font-family: 'Noto Serif Devanagari', 'Noto Sans Devanagari', serif; }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081713" />
      <stop offset="45%" stop-color="#112E27" />
      <stop offset="100%" stop-color="#06120E" />
    </linearGradient>

    <radialGradient id="saffronGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FF9933" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="goldGlowBottom" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0" />
    </radialGradient>

    <!-- Gold & Saffron Text Gradients -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#FFB347" />
      <stop offset="70%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E67300" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD180" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#B35900" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E67300" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A443A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F2B24" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rich Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#saffronGlow)" />
  <rect width="1200" height="630" fill="url(#goldGlowBottom)" />

  <!-- Subtle Traditional Geometric Pattern Overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1" fill="none">
    <circle cx="600" cy="315" r="450" />
    <circle cx="600" cy="315" r="320" />
    <circle cx="600" cy="315" r="180" />
    <polygon points="600,65 850,500 350,500" />
    <polygon points="600,565 850,130 350,130" />
  </g>

  <!-- Chhatrapati Shivaji Maharaj Royal Watermark (Right Background) -->
  <g transform="translate(810, 110) scale(1.15)" opacity="0.28" filter="url(#glowFilter)">
    <!-- Horse & Rider Silhouette -->
    <path d="M120,40 Q130,20 150,15 Q170,12 185,25 Q195,35 185,55 Q175,70 190,85 Q210,105 240,110 Q280,115 310,140 Q330,160 325,190 Q320,210 290,230 Q280,240 285,270 Q290,300 270,330 L250,340 L240,280 Q220,290 200,340 L180,340 Q190,290 170,270 Q140,270 120,250 Q90,230 85,190 Q80,160 100,130 Q110,110 115,80 Z" fill="#FF9933" />
    <!-- Raised Hoof Pose -->
    <path d="M260,200 Q280,170 300,140 Q315,120 330,110 Q340,105 345,115 Q340,125 320,150 L295,195 Z" fill="#FF9933" />
    <path d="M245,210 Q270,230 290,260 L280,290 L260,250 Z" fill="#FF9933" />
    <!-- Flowing Mane and Tail -->
    <path d="M90,170 Q60,190 40,240 Q25,280 20,330 Q35,300 55,270 Q70,250 85,220 Z" fill="#FFB347" />
    <!-- Shivaji Maharaj - Pagadi (Turban) & Feather -->
    <path d="M145,25 Q140,5 155,0 Q170,-2 180,8 Q190,18 175,25 Z" fill="#FFE0B2" />
    <path d="M152,0 Q150,-18 158,-28 Q162,-15 156,0 Z" fill="#FFE0B2" />
    <!-- Royal Sword (Talwar) Raised High -->
    <path d="M165,15 L260,-60 L266,-56 L172,22 Z" fill="#FFD180" />
    <polygon points="260,-60 275,-80 266,-56" fill="#FFF2D6" />
    <circle cx="168" cy="18" r="6" fill="#FF9933" />
  </g>

  <!-- Royal Decorative Outer Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="14" fill="none" stroke="url(#goldStroke)" stroke-width="2.5" opacity="0.85" />
  <rect x="34" y="34" width="1132" height="562" rx="10" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Corner Ornaments -->
  <!-- Top Left -->
  <g transform="translate(42, 42)">
    <path d="M0,28 L0,0 L28,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="12" cy="12" r="3" fill="#FFE0B2" />
  </g>
  <!-- Top Right -->
  <g transform="translate(1158, 42)">
    <path d="M0,28 L0,0 L-28,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="-12" cy="12" r="3" fill="#FFE0B2" />
  </g>
  <!-- Bottom Left -->
  <g transform="translate(42, 588)">
    <path d="M0,-28 L0,0 L28,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="12" cy="-12" r="3" fill="#FFE0B2" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(1158, 588)">
    <path d="M0,-28 L0,0 L-28,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
    <circle cx="-12" cy="-12" r="3" fill="#FFE0B2" />
  </g>

  <!-- Left Content Zone -->

  <!-- Top Badge / Pill -->
  <g transform="translate(70, 72)">
    <rect width="360" height="42" rx="21" fill="url(#badgeGrad)" filter="url(#shadowFilter)" />
    <text x="180" y="27" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" class="font-mr" letter-spacing="1">
      🚩 अस्सल महाराष्ट्रीयन फॅमिली रेस्टॉरंट 🚩
    </text>
  </g>

  <!-- Brand Logo + Hero Title Group -->
  <g transform="translate(70, 140)">
    <!-- Brand Icon -->
    <g transform="translate(0, 10)">
      <circle cx="48" cy="48" r="48" fill="#143A31" stroke="url(#goldStroke)" stroke-width="3" filter="url(#shadowFilter)" />
      <!-- Floral Petals Around Om -->
      <circle cx="48" cy="14" r="5" fill="#FF9933" />
      <circle cx="48" cy="82" r="5" fill="#FF9933" />
      <circle cx="14" cy="48" r="5" fill="#FF9933" />
      <circle cx="82" cy="48" r="5" fill="#FF9933" />
      <circle cx="24" cy="24" r="4" fill="#FFD180" />
      <circle cx="72" cy="24" r="4" fill="#FFD180" />
      <circle cx="24" cy="72" r="4" fill="#FFD180" />
      <circle cx="72" cy="72" r="4" fill="#FFD180" />
      <!-- Devanagari OM Symbol -->
      <text x="48" y="61" text-anchor="middle" fill="url(#goldTextGrad)" font-size="44" font-weight="900" class="font-serif-mr">ॐ</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(120, 0)">
      <!-- Drop Shadow for Text -->
      <text x="3" y="77" fill="#000000" opacity="0.6" font-size="68" font-weight="900" class="font-serif-mr">हॉटेल ओम गार्डन</text>
      <text x="0" y="74" fill="url(#goldTextGrad)" font-size="68" font-weight="900" class="font-serif-mr">हॉटेल ओम गार्डन</text>
      <!-- English Brand Sub-Label -->
      <text x="5" y="112" fill="#FFE0B2" opacity="0.85" font-size="20" font-weight="700" letter-spacing="3">HOTEL OM GARDEN • FAMILY RESTAURANT</text>
    </g>
  </g>

  <!-- Tagline / Highway Location -->
  <g transform="translate(70, 290)">
    <rect width="660" height="42" rx="8" fill="#0B231D" stroke="#255548" stroke-width="1.5" />
    <!-- Location Pin Icon -->
    <path d="M22,14 C17,14 13,18 13,23 C13,30 22,37 22,37 C22,37 31,30 31,23 C31,18 27,14 22,14 Z" fill="#FF9933" />
    <circle cx="22" cy="23" r="3" fill="#FFFFFF" />
    <text x="44" y="27" fill="#FFF4E0" font-size="19" font-weight="600" class="font-mr">
      अहमदनगर–सोलापूर महामार्ग, मांदळी (ता. कर्जत, जि. अहिल्यानगर)
    </text>
  </g>

  <!-- 4 Feature Cards (2x2 Grid) -->
  <g transform="translate(70, 355)">
    <!-- Card 1: चविष्ट घरगुती जेवण -->
    <g transform="translate(0, 0)">
      <rect width="320" height="64" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.5" />
      <circle cx="36" cy="32" r="20" fill="#FF9933" fill-opacity="0.2" />
      <text x="36" y="38" text-anchor="middle" font-size="20">🍲</text>
      <text x="68" y="29" fill="#FFFFFF" font-size="17" font-weight="700" class="font-mr">चविष्ट घरगुती जेवण</text>
      <text x="68" y="49" fill="#CBD5E1" font-size="13" font-weight="500" class="font-mr">झणझणीत मटण, चिकन व भाकरी</text>
    </g>

    <!-- Card 2: कौटुंबिक बैठक व्यवस्था -->
    <g transform="translate(340, 0)">
      <rect width="320" height="64" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.5" />
      <circle cx="36" cy="32" r="20" fill="#FF9933" fill-opacity="0.2" />
      <text x="36" y="38" text-anchor="middle" font-size="20">👨‍👩‍👧‍👦</text>
      <text x="68" y="29" fill="#FFFFFF" font-size="17" font-weight="700" class="font-mr">स्वतंत्र कुटुंब बैठक</text>
      <text x="68" y="49" fill="#CBD5E1" font-size="13" font-weight="500" class="font-mr">शांत, सुरक्षित व निसर्गरम्य परिसर</text>
    </g>

    <!-- Card 3: प्रशस्त कार पार्किंग -->
    <g transform="translate(0, 76)">
      <rect width="320" height="64" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.5" />
      <circle cx="36" cy="32" r="20" fill="#FF9933" fill-opacity="0.2" />
      <text x="36" y="38" text-anchor="middle" font-size="20">🅿️</text>
      <text x="68" y="29" fill="#FFFFFF" font-size="17" font-weight="700" class="font-mr">मोफत प्रशस्त पार्किंग</text>
      <text x="68" y="49" fill="#CBD5E1" font-size="13" font-weight="500" class="font-mr">महामार्गावर सुलभ व सुरक्षित थांबा</text>
    </g>

    <!-- Card 4: स्वतंत्र परमिट रूम -->
    <g transform="translate(340, 76)">
      <rect width="320" height="64" rx="10" fill="url(#cardGrad)" stroke="#265B4F" stroke-width="1.5" />
      <circle cx="36" cy="32" r="20" fill="#FF9933" fill-opacity="0.2" />
      <text x="36" y="38" text-anchor="middle" font-size="20">🍷</text>
      <text x="68" y="29" fill="#FFFFFF" font-size="17" font-weight="700" class="font-mr">स्वतंत्र परमिट रूम</text>
      <text x="68" y="49" fill="#CBD5E1" font-size="13" font-weight="500" class="font-mr">कायदेशीर व स्वतंत्र व्यवस्था</text>
    </g>
  </g>

  <!-- Right Visual Zone: Stylized Food Thali & Bhagwa Flag Banner -->
  <g transform="translate(860, 260)" filter="url(#shadowFilter)">
    <!-- Outer Brass Plate Glow -->
    <circle cx="140" cy="140" r="130" fill="#143A31" stroke="url(#goldStroke)" stroke-width="4" />
    <circle cx="140" cy="140" r="115" fill="#0C251F" stroke="#E67300" stroke-width="1.5" stroke-dasharray="6 4" />
    
    <!-- Central Maharashtrian Thali Illustration -->
    <!-- Bhakri -->
    <circle cx="140" cy="140" r="50" fill="#F4E4BA" stroke="#D1B87F" stroke-width="2" />
    <circle cx="132" cy="132" r="4" fill="#C49B55" opacity="0.6" />
    <circle cx="150" cy="148" r="3" fill="#C49B55" opacity="0.6" />
    <circle cx="138" cy="155" r="3.5" fill="#C49B55" opacity="0.5" />
    
    <!-- Katori 1: Spiced Curry (Rassa) -->
    <circle cx="95" cy="80" r="26" fill="#A83210" stroke="#FFD180" stroke-width="2" />
    <circle cx="95" cy="80" r="22" fill="#BA3C13" />
    <circle cx="95" cy="76" r="6" fill="#3D8B37" opacity="0.8" />
    
    <!-- Katori 2: Sukka Masala -->
    <circle cx="185" cy="80" r="26" fill="#5E2812" stroke="#FFD180" stroke-width="2" />
    <circle cx="185" cy="80" r="22" fill="#783417" />
    
    <!-- Katori 3: Pithla / Dal -->
    <circle cx="70" cy="155" r="24" fill="#D99B00" stroke="#FFD180" stroke-width="2" />
    <circle cx="70" cy="155" r="20" fill="#F0AC00" />
    
    <!-- Katori 4: Indrayani Rice -->
    <circle cx="210" cy="155" r="24" fill="#FAF6EC" stroke="#FFD180" stroke-width="2" />
    <circle cx="210" cy="155" r="20" fill="#FFFFFF" />
    
    <!-- Lemon & Onion Salad -->
    <path d="M125,215 Q140,205 155,215 Q140,225 125,215 Z" fill="#E2E8F0" stroke="#94A3B8" />
    <circle cx="140" cy="215" r="7" fill="#FACC15" />

    <!-- Thali Badge -->
    <rect x="55" y="278" width="170" height="32" rx="16" fill="url(#badgeGrad)" stroke="#FFE0B2" stroke-width="1.5" />
    <text x="140" y="299" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" class="font-mr">
      अस्सल गावरान चव
    </text>
  </g>

  <!-- Flowing Bhagwa Zenda (Top Right) -->
  <g transform="translate(1040, 60)" filter="url(#shadowFilter)">
    <!-- Flag Stick / Pole -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#FFE0B2" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#FFD180" stroke="#E67300" stroke-width="2" />
    
    <!-- Fluttering Twin Swallowtail Flag Shape -->
    <path d="M0,8 C30,2 60,18 85,10 C105,4 125,14 135,28 L80,50 L135,74 C115,88 85,78 60,86 C30,94 15,82 0,84 Z" fill="url(#badgeGrad)" stroke="#FFA726" stroke-width="1" />
    <!-- Gold Border on Flag -->
    <path d="M0,8 C30,2 60,18 85,10 C105,4 125,14 135,28 L80,50 L135,74 C115,88 85,78 60,86 C30,94 15,82 0,84" fill="none" stroke="#FFE8B3" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Bottom Verified Bar / Footer Section -->
  <g transform="translate(70, 520)">
    <!-- Top separator line -->
    <line x1="0" y1="0" x2="1060" y2="0" stroke="url(#goldStroke)" stroke-width="1" opacity="0.6" />

    <!-- Phone Number Badge -->
    <g transform="translate(0, 18)">
      <rect width="400" height="48" rx="24" fill="#0E2C24" stroke="#FF9933" stroke-width="1.5" />
      <circle cx="26" cy="24" r="14" fill="#FF9933" />
      <!-- Phone Handset Icon -->
      <path d="M22,18 C20,18 19,20 20,22 C21,24 23,26 25,27 C27,28 29,29 31,28 C33,27 34,25 33,23 L32,21 C31.5,20 30.5,20 30,20.5 L29,21.5 C28.5,22 27.5,21.5 27,21 C26,20 25.5,19 26,18.5 L27,17.5 C27.5,17 27.5,16 27,15.5 L25,14 C24.5,13.5 23.5,13.5 23,14 Z" fill="#FFFFFF" />
      <text x="56" y="31" fill="#FFFFFF" font-size="18" font-weight="800" class="font-mr" letter-spacing="0.5">
        +91 7744009199 / 9767294601
      </text>
    </g>

    <!-- Operational Hours & Service -->
    <g transform="translate(430, 28)">
      <text x="0" y="20" fill="#FFE0B2" font-size="16" font-weight="600" class="font-mr">
        ⏰ वेळ: सकाळी ९:०० ते रात्री ११:०० • दररोज सेवा
      </text>
    </g>

    <!-- Official Website Badge (Right) -->
    <g transform="translate(860, 18)">
      <rect width="200" height="48" rx="24" fill="url(#badgeGrad)" filter="url(#shadowFilter)" />
      <text x="100" y="30" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800" class="font-mr">
        टेबल आरक्षण उपलब्ध
      </text>
    </g>
  </g>
</svg>
