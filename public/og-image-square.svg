<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      .font-mr { font-family: 'Noto Sans Devanagari', 'Liberation Sans', sans-serif; }
    </style>

    <linearGradient id="sqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051510" />
      <stop offset="50%" stop-color="#0E2D24" />
      <stop offset="100%" stop-color="#04120D" />
    </linearGradient>

    <radialGradient id="sqAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FF9933" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sqGoldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="30%" stop-color="#FFE4B5" />
      <stop offset="70%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>

    <linearGradient id="sqGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4B5" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#B35900" />
    </linearGradient>

    <linearGradient id="sqBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E66B00" />
    </linearGradient>

    <linearGradient id="sqCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163E33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E2821" font-opacity="0.95" />
    </linearGradient>

    <filter id="sqShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#sqBgGrad)" />
  <rect width="800" height="800" fill="url(#sqAura)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="752" height="752" rx="20" fill="none" stroke="url(#sqGoldStroke)" stroke-width="2.5" opacity="0.85" />
  <rect x="34" y="34" width="732" height="732" rx="16" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="8 6" opacity="0.35" />

  <!-- Corner Filigrees -->
  <g transform="translate(42, 42)">
    <path d="M0,26 L0,0 L26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
  </g>
  <g transform="translate(758, 42)">
    <path d="M0,26 L0,0 L-26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
  </g>
  <g transform="translate(42, 758)">
    <path d="M0,-26 L0,0 L26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
  </g>
  <g transform="translate(758, 758)">
    <path d="M0,-26 L0,0 L-26,0" fill="none" stroke="#FF9933" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#FF9933" />
  </g>

  <!-- Top Ribbon -->
  <g transform="translate(400, 75)">
    <rect x="-190" y="0" width="380" height="38" rx="19" fill="url(#sqBadgeGrad)" filter="url(#sqShadow)" />
    <path d="M-170,13 L-170,27 M-170,13 L-154,16 L-160,20 L-154,24 L-170,24" stroke="#FFF" stroke-width="1.5" fill="#FFE4B5" stroke-linejoin="round" />
    <text x="0" y="24" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700" class="font-mr" letter-spacing="0.5">
      अस्सल महाराष्ट्रीयन फॅमिली रेस्टॉरंट
    </text>
    <path d="M154,13 L154,27 M154,13 L170,16 L164,20 L170,24 L154,24" stroke="#FFF" stroke-width="1.5" fill="#FFE4B5" stroke-linejoin="round" />
  </g>

  <!-- Royal OM Crest -->
  <g transform="translate(400, 155)">
    <circle cx="0" cy="0" r="32" fill="#143B30" stroke="url(#sqGoldStroke)" stroke-width="2.5" filter="url(#sqShadow)" />
    <circle cx="0" cy="-22" r="3" fill="#FF9933" />
    <circle cx="0" cy="22" r="3" fill="#FF9933" />
    <circle cx="-22" cy="0" r="3" fill="#FF9933" />
    <circle cx="22" cy="0" r="3" fill="#FF9933" />
    <text x="0" y="9" text-anchor="middle" fill="url(#sqGoldTextGrad)" font-size="32" font-weight="900" class="font-mr">ॐ</text>
  </g>

  <!-- Hotel Name -->
  <g transform="translate(400, 240)">
    <text x="2" y="2" text-anchor="middle" fill="#000000" opacity="0.65" font-size="52" font-weight="900" class="font-mr">
      हॉटेल ओम गार्डन
    </text>
    <text x="0" y="0" text-anchor="middle" fill="url(#sqGoldTextGrad)" font-size="52" font-weight="900" class="font-mr">
      हॉटेल ओम गार्डन
    </text>
  </g>

  <g transform="translate(400, 278)">
    <text x="0" y="0" text-anchor="middle" fill="#FFE0B2" opacity="0.9" font-size="14" font-weight="700" letter-spacing="3">
      HOTEL OM GARDEN • MANDALI (KARJAT)
    </text>
  </g>

  <!-- Highway Location Pill -->
  <g transform="translate(400, 308)">
    <rect x="-260" y="0" width="520" height="38" rx="19" fill="#0E2C24" stroke="#FF9933" stroke-width="1.2" />
    <!-- Pin Vector -->
    <path d="M-225,12 C-229,12 -232,15 -232,19 C-232,24 -225,29 -225,29 C-225,29 -218,24 -218,19 C-218,15 -221,12 -225,12 Z" fill="#FF9933" />
    <circle cx="-225" cy="18" r="2.5" fill="#FFFFFF" />
    <text x="10" y="24" text-anchor="middle" fill="#FFF4E0" font-size="15" font-weight="600" class="font-mr">
      अहमदनगर–सोलापूर महामार्ग, मांदळी (ता. कर्जत)
    </text>
  </g>

  <!-- Features Grid -->
  <g transform="translate(400, 372)">
    <!-- Row 1 -->
    <g transform="translate(-270, 0)">
      <rect width="260" height="58" rx="12" fill="url(#sqCardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="30" cy="29" r="17" fill="#FF9933" fill-opacity="0.2" />
      <path d="M21,28 Q30,37 39,28 Z" fill="#FFB066" />
      <path d="M25,24 Q27,20 25,18 M30,24 Q32,20 30,18 M35,24 Q37,20 35,18" stroke="#FFE4B5" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <text x="60" y="26" fill="#FFFFFF" font-size="15" font-weight="700" class="font-mr">अस्सल गावरान जेवण</text>
      <text x="60" y="46" fill="#CBD5E1" font-size="12" font-weight="500" class="font-mr">चिकन, मटण व गरमागरम भाकरी</text>
    </g>
    <g transform="translate(10, 0)">
      <rect width="260" height="58" rx="12" fill="url(#sqCardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="30" cy="29" r="17" fill="#FF9933" fill-opacity="0.2" />
      <circle cx="26" cy="24" r="3.5" fill="#FFB066" />
      <path d="M21,34 C21,30 31,30 31,34" stroke="#FFB066" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <circle cx="35" cy="26" r="3" fill="#FFE4B5" />
      <path d="M31,34 C31,31 39,31 39,34" stroke="#FFE4B5" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <text x="60" y="26" fill="#FFFFFF" font-size="15" font-weight="700" class="font-mr">स्वतंत्र कुटुंब बैठक</text>
      <text x="60" y="46" fill="#CBD5E1" font-size="12" font-weight="500" class="font-mr">शांत व सुरक्षित कौटुंबिक सोय</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(-270, 70)">
      <rect width="260" height="58" rx="12" fill="url(#sqCardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="30" cy="29" r="17" fill="#FF9933" fill-opacity="0.2" />
      <circle cx="30" cy="29" r="12" fill="#2563EB" />
      <text x="30" y="34" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" font-family="sans-serif">P</text>
      <text x="60" y="26" fill="#FFFFFF" font-size="15" font-weight="700" class="font-mr">प्रशस्त मोफत पार्किंग</text>
      <text x="60" y="46" fill="#CBD5E1" font-size="12" font-weight="500" class="font-mr">महामार्गावर सुरक्षित सोय</text>
    </g>
    <g transform="translate(10, 70)">
      <rect width="260" height="58" rx="12" fill="url(#sqCardGrad)" stroke="#265B4F" stroke-width="1.2" />
      <circle cx="30" cy="29" r="17" fill="#FF9933" fill-opacity="0.2" />
      <path d="M24,22 L36,22 L33,30 L27,30 Z M30,30 L30,36 M26,36 L34,36" stroke="#FFB066" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="60" y="26" fill="#FFFFFF" font-size="15" font-weight="700" class="font-mr">स्वतंत्र परमिट रूम</text>
      <text x="60" y="46" fill="#CBD5E1" font-size="12" font-weight="500" class="font-mr">कायदेशीर व स्वतंत्र व्यवस्था</text>
    </g>
  </g>

  <!-- Service Ratings -->
  <g transform="translate(400, 532)">
    <polygon points="-215,0 -213,5 -207,5 -211,8 -209,13 -215,10 -221,13 -219,8 -223,5 -217,5" fill="#FACC15" transform="translate(0, -7)" />
    <text x="-140" y="0" text-anchor="middle" fill="#FFE4B5" font-size="14" font-weight="600" class="font-mr">
      ४.८/५ ग्राहक रेटिंग
    </text>
    <circle cx="-75" cy="-4" r="2.5" fill="#FF9933" />
    <circle cx="-50" cy="-4" r="6" stroke="#FFE4B5" stroke-width="1.2" fill="none" />
    <path d="M-50,-7 L-50,-4 L-47,-4" stroke="#FFE4B5" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <text x="40" y="0" text-anchor="middle" fill="#FFE4B5" font-size="14" font-weight="600" class="font-mr">
      सकाळी ९:०० ते रात्री ११:००
    </text>
    <circle cx="145" cy="-4" r="2.5" fill="#FF9933" />
    <text x="195" y="0" text-anchor="middle" fill="#FFE4B5" font-size="14" font-weight="600" class="font-mr">
      दररोज सेवा
    </text>
  </g>

  <!-- Contact CTA -->
  <g transform="translate(400, 568)">
    <rect x="-240" y="0" width="480" height="54" rx="27" fill="#0C251F" stroke="url(#sqGoldStroke)" stroke-width="2" filter="url(#sqShadow)" />
    <circle cx="-195" cy="27" r="16" fill="#FF9933" />
    <path d="M-199,21 C-201,21 -202,22.5 -201,24 C-200,25.5 -198,27 -197,28 C-195.5,29 -194,30 -192,29 C-190.5,28.5 -190,27 -190.5,25.5 L-191.5,24 C-192,23 -193,23 -193.5,23.5 L-194.5,24.5 C-195,25 -195.8,24.5 -196.2,24 C-196.8,23.2 -197.2,22.5 -196.8,22 L-196,21 C-195.5,20.5 -195.5,19.5 -196,19 L-197.5,18 C-198,17.5 -198.8,17.5 -199,18 Z" fill="#FFFFFF" />
    <text x="-4" y="34" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700" class="font-mr" letter-spacing="0.5">
      संपर्क: +91 7744009199 / 9767294601
    </text>
  </g>

  <!-- Bottom Booking Button -->
  <g transform="translate(400, 648)">
    <rect x="-160" y="0" width="320" height="34" rx="17" fill="url(#sqBadgeGrad)" />
    <text x="0" y="22" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" class="font-mr" letter-spacing="0.5">
      टेबल बुकिंग व ऑर्डरसाठी संपर्क करा
    </text>
  </g>

  <g transform="translate(400, 712)">
    <text x="0" y="0" text-anchor="middle" fill="#FFE0B2" opacity="0.8" font-size="12" font-weight="600" class="font-mr">
      जय शिवराय • अस्सल गावरान चव आणि आपुलकीचे आतिथ्य
    </text>
  </g>
</svg>
