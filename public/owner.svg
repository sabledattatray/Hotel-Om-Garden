<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B3" />
      <stop offset="50%" stop-color="#D98A1E" />
      <stop offset="100%" stop-color="#804300" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </radialGradient>
  </defs>

  <!-- Photo Base -->
  <image href="/owner.jpg" x="0" y="0" width="800" height="1000" preserveAspectRatio="xMidYMid slice" />

  <!-- Subtle Vignette Frame -->
  <rect x="0" y="0" width="800" height="1000" fill="url(#vignette)" pointer-events="none" />

  <!-- Elegant Golden Inset Border -->
  <rect x="20" y="20" width="760" height="960" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="3" opacity="0.85" pointer-events="none" />
  <rect x="26" y="26" width="748" height="948" rx="12" fill="none" stroke="#FF9933" stroke-width="1" stroke-dasharray="6 4" opacity="0.5" pointer-events="none" />
</svg>
